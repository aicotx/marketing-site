repos:
  # pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # prettier formatters
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        entry: npx prettier --write
        files: \.(js|ts|tsx)$
        pass_filenames: true

  # typescript linter
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: node
        entry: npx eslint --ext .js,.ts,.tsx app
        pass_filenames: false

